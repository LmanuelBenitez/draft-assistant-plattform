services:
  backend:
    build:
      context: ./backend/backend
      dockerfile: Dockerfile
    container_name: draft-backend
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - DeepSeek__ApiKey=${DEEPSEEK_API_KEY}
      - FootballApi__ApiKey=${FOOTBALL_API_KEY}
    volumes:
      - backend-data:/app/data
    networks:
      - draft-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: draft-frontend
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - draft-network
    restart: unless-stopped

networks:
  draft-network:
    driver: bridge

volumes:
  backend-data: